name: Release

# Tag a commit (e.g. v1.0.0) to build the scanner as one executable, publish it as a
# GitHub Release with a SHA-256 checksum, and generate release notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & publish scanner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (single self-contained 32-bit executable for 32/64-bit Windows)
        run: dotnet publish windows/ACPScanner.csproj -c Release -o dist

      - name: Name and checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "ACS-Scanner-$version-windows.exe"
          Move-Item dist/ACPScanner.exe $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "$name.sha256" -Encoding ascii
          Get-Content "$name.sha256"
          "ASSET=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
          draft: true
