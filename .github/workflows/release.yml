name: Release

# Tag a commit (e.g. v3.3.0) to build the scanner, publish it as a GitHub
# Release with a SHA-256 checksum, and generate release notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & publish scanner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish windows/ACPScanner.csproj -c Release -r win-x64 --self-contained -o dist

      - name: Package
        shell: pwsh
        run: |
          $name = "ACS-Scanner-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash
          "SHA256  $hash  $name" | Out-File "$name.sha256" -Encoding ascii
          Get-Content "$name.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ACS-Scanner-${{ github.ref_name }}.zip
            ACS-Scanner-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
          draft: true
