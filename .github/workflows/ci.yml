name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, fileinfo, pdo_sqlite

      - name: Lint every PHP file
        run: |
          find . -name '*.php' \
            -not -path './windows/*' \
            -not -path './design_css/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Backend tests
        env:
          ACPDIR: ${{ github.workspace }}
          SCRATCH: ${{ runner.temp }}
        run: |
          php tests/client_profiles_test.php
          php tests/behavior_test.php
          php tests/risk_thresholds_test.php

  desktop:
    name: Desktop (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build scanner
        run: dotnet build windows/ACPScanner.csproj -c Release --nologo
