# ACS - ReHLDS behavioural engine configuration.
#
# Install to:  cstrike/addons/acs/acs.cfg
#
# This is read directly by the plugin and is NOT exec'd as server cvars. That is
# deliberate: the uplink secret must not become something `rcon cvarlist` can read back,
# and thresholds should not be changeable live by anyone with rcon.
#
# Format is "key value", one per line. Everything after # is a comment.

enabled          1
log_to_console   1

# ---------------------------------------------------------------------------
# Uplink
# ---------------------------------------------------------------------------
# The backend's telemetry endpoint. Only http:// is supported in-process - the plugin
# has no TLS, by choice, because linking OpenSSL into a 32-bit Metamod plugin on an
# arbitrary distro is a portability problem out of proportion to the benefit. Put the
# backend behind a TLS-terminating reverse proxy and point this at the local side of it,
# or keep the link on a private network.
#
# Events are HMAC-SHA256 signed either way, so they cannot be forged or edited in
# transit; what plain HTTP loses is confidentiality, not authenticity.
endpoint         http://127.0.0.1:8080/acp/telemetry.php

# Must equal ACP_TELEMETRY_SECRET on the backend. With this unset the plugin refuses to
# upload rather than sending unauthenticated evidence - anyone who can post unsigned
# telemetry can fabricate a record against any SteamID.
#
# Prefer supplying this via the ACS_SECRET environment variable so the file itself can
# be committed. The environment always wins over this file.
secret

# Free-form name for this server, shown in the dashboard.
server_id        cs-public-1

# ---------------------------------------------------------------------------
# Aim
# ---------------------------------------------------------------------------
# Angular distance that counts as a snap. The main sensitivity dial: lower finds more,
# and finds more honest flick-shooters with it.
snap_min_deg     18

# Mean deg/tick the view must have been below before the snap, and settle below after.
snap_quiet_deg   1.5
snap_settle_deg  1.5

# The shot must land within this many ticks of the snap ending.
snap_fire_ticks  4

# Confirmed snap-fire events before the (WARNING-level) pattern rule reports. The
# DETECTED rules - instant arrival and interpolated path - have their own thresholds and
# are not affected by this.
snap_report_at   6

# ---------------------------------------------------------------------------
# Recoil
# ---------------------------------------------------------------------------
# Correlation between pitch input and punchangle past which compensation stops looking
# like a hand, and the per-tick RMS compensation error in degrees. BOTH must be met.
# Good players sit around 0.4-0.6 correlation with residuals several times larger, so
# there is a wide margin here; tighten only if you see false positives.
recoil_r         0.90
recoil_residual  0.35
recoil_min_shots 10
recoil_report_at 3

# ---------------------------------------------------------------------------
# Movement
# ---------------------------------------------------------------------------
# Consecutive frame-perfect jumps before reporting. Raise this if your server allows
# wheel-bound jump, which produces short legitimate streaks.
bhop_streak      8

# Air-strafe sync ratio past which the yaw is being derived from the key rather than
# aimed. Human strafers run 0.85-0.95.
sync_ratio       0.98

# ---------------------------------------------------------------------------
# Usercmd
# ---------------------------------------------------------------------------
# Claimed simulation time divided by real elapsed time, above which it is a speed hack.
speed_ratio      1.05

# Largest |forwardmove| / |sidemove| a retail client emits (cl_forwardspeed caps at 400).
max_move         400
